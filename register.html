<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Ende Enat</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame">

  <header>
    <nav>
      <div class="logo">
        ENDE ENAT
        <span>Care. Support. Recover.</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="packages.html">Care Packages</a></li>
        <li><a href="caregivers.html">Caregivers</a></li>
        <li><a href="teleconsultation.html">Teleconsultation</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="auth-buttons">
        <button class="login-btn" onclick="location.href='login.html'">Login</button>
        <button class="register-btn" onclick="location.href='register.html'">Register</button>
      </div>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-box">
      <h2>Create Account</h2>
      <p class="auth-sub">Join Ende Enat today</p>
      <form class="auth-form">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="tel" placeholder="Phone Number" required>
        <input type="password" placeholder="Password" required>
        <select required>
          <option value="" disabled selected>I am a...</option>
          <option>Mother</option>
          <option>Caregiver</option>
        </select>
        <button type="submit" class="auth-submit">Register</button>
      </form>
      <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </section>

</div>

<footer>
  <h3>Ende Enat</h3>
  <p>Care. Support. Recover.</p>
  <p>© 2026 Ende Enat. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
